    <script>
      /* Safe polyfill wrapper to ensure window.fetch can be assigned by iframe/preview wrappers */
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = origFetch ? function() { return origFetch.apply(window, arguments); } : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          /* ignore if cannot redefine */
        }
      })();
    </script>
